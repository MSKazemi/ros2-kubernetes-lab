name: Verify and publish ROS 2 Jazzy image

# This workflow never runs on pull_request. PRs run the no-secrets image
# smoke test in ros2-image-ci.yml. Publishing is allowed from main only.
on:
  push:
    branches:
      - main
    paths:
      - ROS2/Dockerfile
      - scripts/test-ros2-image.sh
      - scripts/test-ros2-pulse.sh
      - .github/workflows/main.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Jazzy image before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the ROS 2 Jazzy amd64 image
        run: docker build --platform linux/amd64 --pull --file ROS2/Dockerfile --tag ros-jazzy-lab:local .
      - name: Check distro, demo nodes, stress-ng and local message delivery
        run: docker run --rm -i --platform linux/amd64 ros-jazzy-lab:local bash -s < scripts/test-ros2-image.sh
      - name: Check opt-in ros2_pulse probe, pulse-check and pulse-export
        run: docker run --rm -i --platform linux/amd64 --user 1000:1000 ros-jazzy-lab:local bash -s < scripts/test-ros2-pulse.sh

  publish:
    name: Publish source-SHA-tagged image to Docker Hub
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish image (amd64)
        id: publish_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./ROS2/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ros-jazzy-with-stress-ng:sha-${{ github.sha }}
      - name: Record immutable published digest
        env:
          DIGEST: ${{ steps.publish_image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/ros-jazzy-with-stress-ng
        shell: bash
        run: |
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "Docker build-push-action did not return an image digest." >&2
            exit 1
          fi
          echo "Published image digest: ${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
