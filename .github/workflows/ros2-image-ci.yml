name: Verify ROS 2 Jazzy container

# Expensive Docker builds run only for changes that affect the image/test itself.
# YAML-manifest validation belongs to the separate Kubernetes CI issue #29.
on:
  pull_request:
    paths:
      - ROS2/Dockerfile
      - scripts/test-ros2-image.sh
      - scripts/test-ros2-pulse.sh
      - .github/workflows/ros2-image-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jazzy-image-smoke:
    name: Build image and verify local ROS messaging (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Jazzy image on amd64
        run: docker build --platform linux/amd64 --pull --file ROS2/Dockerfile --tag ros-jazzy-lab:local .
      - name: Check Jazzy, demo nodes, stress-ng and local talker/listener
        run: docker run --rm -i --platform linux/amd64 ros-jazzy-lab:local bash -s < scripts/test-ros2-image.sh
      # Opt-in ros2_pulse pilot (issue #52), as the same non-root uid as the example pods.
      - name: Check opt-in ros2_pulse probe, pulse-check and pulse-export (one container)
        run: docker run --rm -i --platform linux/amd64 --user 1000:1000 ros-jazzy-lab:local bash -s < scripts/test-ros2-pulse.sh
