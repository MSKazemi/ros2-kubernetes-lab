name: Validate Markdown links

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.py'
      - 'scripts/markdown-links-known-issues.txt'
      - '.github/workflows/validate-markdown-links.yml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.py'
      - 'scripts/markdown-links-known-issues.txt'
      - '.github/workflows/validate-markdown-links.yml'

permissions:
  contents: read

jobs:
  markdown-links:
    name: Local Markdown links and anchors (no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        # actions/checkout v4.2.2: pinned for a reproducible, least-privilege check.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        # actions/setup-python v7.1.0: pinned to a commit SHA like the checkout step.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check local links in tracked Markdown files
        shell: bash
        run: python3 scripts/check-markdown-links.py
