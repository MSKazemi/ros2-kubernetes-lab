name: Validate shell scripts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Bash syntax (no VMs or Docker credentials)
    # Run only in the public repository; the private mirror and forks execute nothing.
    if: github.repository == 'MSKazemi/robo-resilience-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        # actions/checkout v4.2.2: pinned for a reproducible, least-privilege check.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate tracked Bash scripts
        shell: bash
        run: bash scripts/check-shell.sh
