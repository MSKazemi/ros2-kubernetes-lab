name: Validate shell scripts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Bash syntax (no VMs or Docker credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        # actions/checkout v7.0.1: pinned for a reproducible, least-privilege check.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tracked Bash scripts
        shell: bash
        run: bash scripts/check-shell.sh
