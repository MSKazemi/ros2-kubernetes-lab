# Least-privilege alternative to admin-user.yaml (read-only dashboard access).
#
# Binds the built-in "view" ClusterRole: read most objects in every namespace,
# but NO write access and NO access to Secrets (per the Kubernetes RBAC default
# ClusterRoles documentation). Use it when you only need to look at the lab.
#
# Apply and read the token:
#   kubectl apply -f MonitoringSystem/admin-user-readonly.yaml
#   kubectl -n kubernetes-dashboard get secret dashboard-viewer \
#     -o go-template='{{.data.token | base64decode}}'
#
# Note: the dashboard's own UI may show "forbidden" for actions this role
# does not allow; that is expected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-viewer
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: dashboard-viewer
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: dashboard-viewer
  namespace: kubernetes-dashboard
