# =====================================================================
# WARNING: this admin-user binds the built-in cluster-admin ClusterRole.
# Its token gives FULL control of the cluster (read/write every namespace,
# read every Secret, create privileged pods). Anyone who can reach the
# dashboard login page and obtain this token owns the cluster.
# It is kept because monitoring.sh applies it and the lab relies on it.
# For read-only dashboard browsing use admin-user-readonly.yaml instead.
# Do not expose the dashboard beyond a trusted lab network.
# =====================================================================
# admin-user Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: admin-user
---
# admin-user Cluster Rolebinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
