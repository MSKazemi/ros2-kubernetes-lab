# LEGACY FOXy EXAMPLE (ROS 2 Foxy is end-of-life).
# Uses the historical Foxy stress-ng image and older Kubernetes lab.
# NOT a ROS 2 Jazzy deployment or a verified cross-node DDS demonstration.
# For the independent Jazzy container image, see ROS2/jazzy/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: ros
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ros
  name: ros
  namespace: ros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ros
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ros
    spec:
      containers:
        # - image: docker.io/osrf/ros:foxy-desktop
        - image: docker.io/kazemi/ros-foxy-with-stress-ng
          name: ros
          command:
            - /bin/bash
            - '-c'
          args:
            # - source /opt/ros/foxy/setup.bash && sleep 3600
            - stress-ng --cpu 1 --cpu-load 80 --timeout 3600s
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
status: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ros-hpa
  namespace: ros  # Namespace where your deployment resides
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ros  # The deployment name to be scaled
  minReplicas: 1  # Minimum number of replicas
  maxReplicas: 10000  # Maximum number of replicas
  metrics:
  - type: Resource
    resource:
      name: cpu  # Scaling based on CPU utilization
      target:
        type: Utilization
        averageUtilization: 70  # Target average CPU utilization percentage
  behavior:  # Optional, defines scaling behavior
    scaleUp:
      stabilizationWindowSeconds: 0  # No delay for scaling up
      policies:
      - type: Percent
        value: 100  # Allows scaling up by 100% (doubling replicas)
        periodSeconds: 30  # Policy window: 30 seconds
    scaleDown:
      stabilizationWindowSeconds: 0  # No stabilization delay for scaling down
      policies:
      - type: Percent
        value: 50  # Scale down by 50% at most. Maximum percentage of replicas that can be removed (scaled down) in a single step during scaling down.
        periodSeconds: 30  # Policy window: 30 seconds