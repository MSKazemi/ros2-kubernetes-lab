  <path d="M210 12 269-77l36 12-51 109" fill="url(#steel)" stroke="#92CBED" stroke-width="4"/>
  <circle cx="290" cy="-58" r="20" fill="#11294B" stroke="#83F6EC" stroke-width="7"/>
  <path d="m303-68 36-27m-36 52 39 22" fill="none" stroke="#B3DFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="156" cy="137" r="11" fill="#7AF9E0"/>
