  <circle cx="155" cy="-30" r="6" fill="#7EFEE4"/>
</g>
<!-- Robotic arm, right foreground -->
<g filter="url(#soft)" transform="translate(813 408)">
  <ellipse cx="182" cy="270" rx="188" ry="28" fill="#060D24" opacity=".7"/>
  <path d="m41 217 178-13 46 36-36 23H43Z" fill="#294C78" stroke="#81B7EA" stroke-width="3"/>
  <path d="m65 217 70-99 45 22-41 84" fill="url(#steel)" stroke="#92D7F5" stroke-width="3"/>
