<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Robotics cloud laboratory concept illustration</title>
<desc id="desc">Stylized robotic rover, articulated robot arm, orbiting pods and connected Kubernetes-style infrastructure, with no depiction of an actual deployment.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A182D"/><stop offset=".58" stop-color="#0E2140"/><stop offset="1" stop-color="#10183B"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91BDEB"/><stop offset=".38" stop-color="#2A4F83"/><stop offset="1" stop-color="#15243E"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#B3FFFF"/><stop offset=".3" stop-color="#63CFF0"/><stop offset="1" stop-color="#4D70DB"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6B7FF"/><stop offset="1" stop-color="#725EE8"/></linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65FFDE" stop-opacity=".24"/><stop offset="1" stop-color="#65FFDE" stop-opacity="0"/></linearGradient>
  <radialGradient id="ambient"><stop stop-color="#2994E4" stop-opacity=".54"/><stop offset="1" stop-color="#134B9B" stop-opacity="0"/></radialGradient>
  <radialGradient id="purpleGlow"><stop stop-color="#956DFF" stop-opacity=".39"/><stop offset="1" stop-color="#8D61FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#669EE8" stroke-opacity=".14"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#06102C" flood-opacity=".8"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<rect width="1200" height="750" fill="url(#grid)" opacity=".8"/>
<circle cx="850" cy="220" r="460" fill="url(#ambient)"/>
<circle cx="230" cy="600" r="350" fill="url(#purpleGlow)"/>
<g opacity=".2" fill="none" stroke="#72BFFF">
  <path d="M0 600 600 340 1200 600M0 680 600 390 1200 680M0 740 600 450 1200 740"/>
  <path d="M80 750 600 330 1100 750M200 750 600 330 1000 750M320 750 600 330 880 750M460 750 600 330 740 750"/>
</g>
<path d="M0 545h1200" stroke="#80FFDB" opacity=".25"/>
<path d="M0 546h1200v155H0z" fill="url(#horizon)" opacity=".5"/>
<!-- Floating orchestration orbit -->
<g fill="none" stroke-linecap="round">
  <path d="M435 230c76-108 345-143 489-34" stroke="#5CEED7" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 11"/>
  <path d="M428 239c-30 120 95 202 230 197" stroke="#8B89FC" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 13"/>
  <path d="M917 217c45 70 3 164-83 196" stroke="#78B4FF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 11"/>
  <circle cx="435" cy="230" r="5" fill="#62EBDA"/><circle cx="917" cy="217" r="5" fill="#9A91FD"/>
  <circle cx="658" cy="436" r="5" fill="#76AFFE"/>
</g>
<!-- Cloud and computer infrastructure cluster -->
<g filter="url(#soft)">
  <path d="M536 172c-21-28-13-66 16-85 29-19 68-8 85 18 10-20 35-31 58-25 27 6 44 27 42 52 30-7 61 13 63 44 3 30-20 56-52 56H571c-29 0-51-20-52-47-1-5 0-9 1-13z" fill="#142D59" stroke="#76DFF0" stroke-opacity=".9" stroke-width="3"/>
  <path d="M547 191h228" stroke="#79F5E4" stroke-opacity=".45"/>
  <circle cx="653" cy="157" r="41" fill="#5D84E5" fill-opacity=".17" stroke="#75E4ED" stroke-width="2"/>
  <path d="M653 126v61m-30-30h60m-52-21 44 44m0-44-44 44" stroke="#B2FFFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="653" cy="157" r="13" fill="#94EFFF"/>
</g>
<!-- Floating workload modules -->
<g filter="url(#soft)">
  <g transform="translate(340 270)">
    <path d="M0 19 65-9l65 28-65 28Z" fill="#294D8E" stroke="#93B8FF" stroke-width="2"/>
    <path d="M0 19v70l65 31V46Z" fill="#1B335C" stroke="#72A2EB" stroke-width="2"/>
