</g>
<!-- Floating data lights and stars -->
<g fill="#7BE5E6"><circle cx="160" cy="189" r="3"/><circle cx="230" cy="271" r="2"/><circle cx="1041" cy="158" r="3"/><circle cx="1076" cy="277" r="2"/><circle cx="837" cy="84" r="2"/></g>
<g opacity=".68" stroke="#83E9E7" stroke-width="2" stroke-linecap="round"><path d="M160 179v20m-10-10h20M1041 148v20m-10-10h20"/></g>
<path d="M0 695h1200" stroke="#70B1EA" stroke-opacity=".35" stroke-width="2"/>
</svg>