  <g transform="translate(850 274) scale(.82)">
    <path d="M0 19 65-9l65 28-65 28Z" fill="#504594" stroke="#B8A2FF" stroke-width="2"/>
    <path d="M0 19v70l65 31V46Z" fill="#2E2A67" stroke="#9F8DFB" stroke-width="2"/>
    <path d="M130 19v70l-65 31V46Z" fill="#453684" stroke="#9F8DFB" stroke-width="2"/>
    <path d="M20 53v22m19-13v22" stroke="#B1A0FF" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>
<path d="M654 235v40H405M654 235v40h250" fill="none" stroke="#69D9E9" stroke-opacity=".5" stroke-width="2"/>
<circle cx="405" cy="275" r="4" fill="#7FFFE8"/><circle cx="904" cy="275" r="4" fill="#A69DFF"/>
<!-- Stylized rover, left foreground -->
