  <path d="m36 100 35-73 208-8 80 65-18 66H47Z" fill="url(#steel)" stroke="#8BC8EC" stroke-width="3"/>
  <path d="m70 34 207-5 51 44-266 2Z" fill="#102947" stroke="#78DDEB" stroke-width="2"/>
  <path d="M78 48h172l39 24H69Z" fill="#153E5E"/>
